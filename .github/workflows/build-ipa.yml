name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build unsigned MaxLite.ipa
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archive (unsigned, simulator-skip)
        run: |
          set -eo pipefail
          xcodebuild \
            -project MaxLite.xcodeproj \
            -scheme MaxLite \
            -configuration Release \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            archive \
            -archivePath build/MaxLite.xcarchive

      - name: Package unsigned IPA
        run: |
          set -eo pipefail
          # Распаковываем .app из архива и упаковываем в Payload/MaxLite.app
          mkdir -p Payload
          cp -R "build/MaxLite.xcarchive/Products/Applications/MaxLite.app" Payload/
          rm -rf Payload/MaxLite.app/_CodeSignature 2>/dev/null || true
          zip -qry MaxLite-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxLite-unsigned-ipa
          path: MaxLite-unsigned.ipa
          if-no-files-found: error